name: Caelis Engine — Validation Suite

on:
  push:
    branches: [ main ]
    paths:
      - 'core/**'
      - 'validation/**'
      - 'package.json'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'core/**'
      - 'validation/**'
      - 'package.json'
      - '.github/workflows/**'

jobs:
  validate:
    name: Mathematical Pipeline Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run validation suite
        run: node validation/run.js --verbose

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-failure-${{ github.sha }}
          path: validation/

  schema:
    name: Schema v3.1 Invariants
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Schema invariants only
        run: node validation/run.js --epoch=schema --verbose

  regression:
    name: Regression — Canonical Epochs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        epoch: [j2000, meeus_ch25, meeus_ch33, epoch_2026]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run epoch ${{ matrix.epoch }}
        run: node validation/run.js --epoch=${{ matrix.epoch }} --verbose

  suites:
    name: All suites (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ 18, 20, 22 ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # fetches the v4.0.13 tag used as baseline by two suites
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Baseline tag available
        run: git rev-parse --verify v4.0.13
      - run: node validation/run.js
      - run: node validation/scientific/polar-safety.js
      - run: node validation/scientific/clock-stress.js
      - run: node validation/interop/test-cjs.js
      - run: node validation/independent/asc_mc/run-asc-mc.js
      - run: node validation/input-validation.js
      - run: node validation/state-isolation.js
